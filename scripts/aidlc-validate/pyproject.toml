[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aidlc-validate"
version = "0.1.0"
description = "Deterministic checks for AI-DLC autonomous-fork artifacts"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
aidlc-validate = "aidlc_validate.cli:main"

[tool.setuptools.packages.find]
include = ["aidlc_validate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
