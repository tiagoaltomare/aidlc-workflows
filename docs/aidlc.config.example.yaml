# aidlc.config.yaml
schema_version: "1"

project_type: greenfield  # greenfield | brownfield
# In practice Workspace Detection confirms this from the codebase;
# this field is the project's declaration and must be reconciled with
# what is detected.

depth: standard  # minimal | standard | comprehensive  (official v1 rule)

vision:
  vision_path: aidlc-docs/vision/vision-document.md          # Tiago's decision
  tech_env_path: aidlc-docs/vision/technical-environment.md  # Tiago's decision
  features_path: aidlc-docs/vision/features.md               # PM default; Tiago may change
  reuse_policy: reuse_if_present  # PM default; Tiago may change
  # reuse_if_present | regenerate | reuse_and_fill_gaps

scope:
  current_path: aidlc-docs/vision/scopes/scope-001.md
  # Canonical file for this cycle (SCOPE-001 → scope-001.md).
  # scope-atual.md is an optional alias of that same file (same SCOPE- id);
  # do not keep two different in-scope sets. The validator uses current_path
  # and de-duplicates files that share a SCOPE- id.

stories:
  format: "as_a_i_want_so_that+gherkin"  # example; "As a / I want / So that" + Given/When/Then
  invest_required: true
  max_size:
    story_points: 5
    max_acceptance_criteria: 5
    max_components_touched: 3
  breakdown_strategy: user_journey     # user_journey | feature | persona | domain | epic
  min_acceptance_criteria: 2

units:
  max_stories_per_unit: 8
  parallelism: sequential              # v1 default: serial loop

extensions:
  opt_in: blocking_question            # PM default; Tiago may change
  # blocking_question | from_config | preset_default

gates:
  human:
    - reverse_engineering              # PM default; Tiago may change; only when RE runs
    - vision_scope
    - inception_end
    - build_and_test                   # PM default; Tiago may change
    - operations
    # Checkpoints inherited from v1-operations (Rules Validation, Deployment,
    # Post-Deployment Testing) remain in those stages' rules.
  checks:
    # ids must match validator subcommands. Omit a check to disable it.
    - id: config
      severity: blocking
    - id: scope-in-vision
      severity: blocking
    - id: traceability
      severity: blocking
    - id: stories
      severity: blocking
    - id: units-dag
      severity: blocking
    - id: assumptions
      severity: blocking
    - id: export
      severity: blocking

design_validation:
  mode: hybrid  # Tiago's decision; auto | human | hybrid
  human_triggers:
    - persistent_data
    - security
    - public_contract
    - external_integration
    - risk_high_or_critical
    - rework_limit_exceeded
    - no_executable_check
  separate_llm_reviewer: true  # required in hybrid / auto when an LLM reviewer is used

limits:
  max_rework_iterations_per_unit: 3
  token_budget_per_unit: 200000
  on_token_budget_exceeded: pause_and_ask_human  # PM default; Tiago may change
  # pause_and_ask_human | log_and_continue | abort_unit

operations:
  docusaurus_path: docs-site           # PM default; Tiago may change
  export_default: true
  # prove_build: omitted. When docs-site/package.json exists, export runs
  # `npm run build`. Set true to require that build even without package.json
  # (fails if node/npm or package.json is missing). Set false to skip it.
  docs:
    language: en                       # field: Tiago's decision; default value: PM default, Tiago may change
  include:                             # PM default; Tiago may change
    - vision
    - technical_environment
    - features
    - scopes
    - requirements
    - user_stories
    - application_design
    - units
    - construction_designs
    - build_and_test_summary
    - operations_summary
    - rules_validation_report
    - post_deployment_test_report
  exclude:                             # PM default; Tiago may change
    - audit
    - question_files
    - raw_plans
    - deployment_deploy_log
