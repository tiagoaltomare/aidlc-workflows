name: CI

on:
  pull_request:
    branches: [ "v1" ]
  push:
    branches: [ "v1", "feature/aidlc-autonomo" ]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff #v24.2.0
        with:
          globs: "**/*.md"
      - name: Check multiple-choice options are blank-line separated (issue #246)
        run: |
          # Multiple-choice options like "A) ..." on consecutive lines without
          # a blank-line separator collapse into a single paragraph in strict
          # CommonMark renderers (IntelliJ/PyCharm preview). Scope mirrors the
          # markdownlint ignores in .markdownlint-cli2.yaml.
          matches=$(find . -name '*.md' \
            -not -path './node_modules/*' \
            -not -path './.claude/*' \
            -not -path './scripts/aidlc-evaluator/test_cases/*' \
            -not -path './scripts/aidlc-validate/tests/fixtures/*' \
            -not -path './.git/*' \
            -not -name 'CHANGELOG.md' \
            -not -path './docs/aidlc-autonomo/plano-aidlc-autonomo.md' \
            -print | xargs awk '
              FNR == 1 { prev_is_option = 0 }
              /^[A-Z]\) / && prev_is_option { print FILENAME ":" FNR ": " $0 }
              { prev_is_option = /^[A-Z]\) / }
            ')
          if [ -n "$matches" ]; then
            echo "Found multiple-choice options on consecutive lines without blank-line separators."
            echo "Add a blank line between each option so CommonMark renderers display them on separate lines."
            echo "$matches"
            exit 1
          fi

  validator:
    name: AIDLC Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: scripts/aidlc-validate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install validator and pytest
        run: pip install -e ".[dev]"
      - name: Run validator pytest
        run: pytest -q

  evaluator-unit:
    name: Evaluator unit tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: scripts/aidlc-evaluator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install evaluator (uv sync)
        run: uv sync
      - name: Run evaluator unit tests
        run: uv run python run.py test

  docusaurus-scaffold:
    name: Docusaurus scaffold
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: templates/docusaurus-scaffold
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: templates/docusaurus-scaffold/package.json
      - name: Install and build scaffold
        run: |
          npm install
          npm run build
